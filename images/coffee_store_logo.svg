<text x="340" y="282" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#5C3D2E" letter-spacing="2" style="fill:rgb(92, 61, 46);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Playfair Display&quot;, Georgia, serif;font-size:28px;font-weight:700;text-anchor:middle;dominant-baseline:auto">BREWED BLISS</text>

